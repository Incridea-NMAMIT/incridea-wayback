name: Prepare explicitly selected frozen edition
on:
  workflow_dispatch:
    inputs:
      year:
        description: Frozen edition directory (production publication requires portal approval)
        required: true
        type: choice
        options: ['2022', '2023', '2024', '2025', '2026']
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  edition:
    uses: Incridea-NMAMIT/incridea-deploy/.github/workflows/application-ci.yml@main
    with:
      application_id: incridea-wayback-${{ inputs.year }}
      dockerfile: infra/archive.Dockerfile
      archive_year: ${{ inputs.year }}
    secrets: inherit
