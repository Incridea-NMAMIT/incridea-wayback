name: Deploy immutable archive edition

on:
  push:
    tags:
      - "edition-[0-9][0-9][0-9][0-9]"
  workflow_dispatch:
    inputs:
      year:
        description: "Four digit archive year"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: edition
        shell: bash
        run: |
          year="${{ inputs.year }}"
          if [ -z "$year" ]; then year="${GITHUB_REF_NAME#edition-}"; fi
          test "${GITHUB_REF_TYPE}" != "tag" || test "${GITHUB_REF_NAME}" = "edition-$year"
          [[ "$year" =~ ^[0-9]{4}$ ]]
          test -f "$year/package.json"
          echo "year=$year" >> "$GITHUB_OUTPUT"
      - run: npm ci
        working-directory: ${{ steps.edition.outputs.year }}
      - run: npm run build:archive -- --year "${{ steps.edition.outputs.year }}"
        working-directory: ${{ steps.edition.outputs.year }}
      - id: deploy
        run: |
          url="$(npx vercel@latest --cwd "${{ steps.edition.outputs.year }}" --prod --skip-domain --token "$VERCEL_TOKEN" --yes)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: npx vercel@latest alias set "${{ steps.deploy.outputs.url }}" "${{ steps.edition.outputs.year }}.wayback.incridea.in" --token "$VERCEL_TOKEN"
